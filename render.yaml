databases:
  - name: gymmis-db
    databaseName: gymmis
    user: gymmis
    plan: free
    region: frankfurt

services:
  - type: web
    name: gymmis-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run build
    startCommand: npm run prisma:push && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gymmis-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: CORS_ORIGIN
        sync: false
      - key: RAG_DATA_DIR
        value: data
      - key: UPLOADS_DIR
        value: uploads
      - key: RAG_VECTOR_STORE
        value: pgvector
